name: publish education
on:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PYCODE'
          import json,zlib,base64,pathlib
          files=json.loads(zlib.decompress(base64.b64decode('')))
          for p,s in files.items():
              pathlib.Path(p).write_text(s)
          PYCODE
          git config user.name "Instinct Agent"
          git config user.email "agent@instinct.com"
          git add index.html css/style.css js/main.js
          git commit -m "Separate Education from work experience"
          git push
